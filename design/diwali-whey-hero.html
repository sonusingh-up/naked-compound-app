<!doctype html>
<!-- Source for /blog/img/diwali-whey-protein-sale-hero.webp (1600x560) and -og.webp (1200x630).
     Render: capture the #art SVG at 1600x560 with headless Chrome (same method as scripts/capture-tool-shots.mjs). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#f4e4cb;}
  svg{display:block;}
  .t-eyebrow{font:600 15px 'JetBrains Mono',monospace;letter-spacing:.22em;fill:#8a4a2c;}
  .t-title{font:700 68px 'Inter Tight',sans-serif;letter-spacing:-.035em;fill:#24201c;}
  .t-serif{font:italic 400 76px 'Instrument Serif',serif;fill:#b4532f;}
  .t-sub{font:600 26px 'Inter Tight',sans-serif;fill:#24201c;letter-spacing:-.01em;}
  .t-small{font:500 14px 'JetBrains Mono',monospace;fill:#6b5a4a;letter-spacing:.06em;}
  .t-tag{font:700 22px 'Inter Tight',sans-serif;fill:#24201c;}
  .t-tagbig{font:700 44px 'Inter Tight',sans-serif;fill:#b4532f;letter-spacing:-.02em;}
  .t-lens{font:700 30px 'Inter Tight',sans-serif;fill:#1f6b3f;}
  .t-lenssm{font:600 13px 'JetBrains Mono',monospace;fill:#1f6b3f;letter-spacing:.06em;}
  .t-label{font:700 20px 'Inter Tight',sans-serif;letter-spacing:.08em;}
  .t-phone{font:600 12px 'JetBrains Mono',monospace;fill:#6b5a4a;letter-spacing:.05em;}
</style>
</head>
<body>
<svg id="art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7ead6"/><stop offset="1" stop-color="#f0dcbf"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd27a" stop-opacity=".75"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e2553a"/><stop offset=".55" stop-color="#f6a33a"/><stop offset="1" stop-color="#ffe08a"/></linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7683f"/><stop offset="1" stop-color="#8f4426"/></linearGradient>
    <clipPath id="lensClip"><circle cx="0" cy="0" r="62"/></clipPath>
  </defs>

  <rect width="1600" height="560" fill="url(#bg)"/>

  <!-- faint rangoli rosettes -->
  <g opacity=".22" fill="none" stroke="#c96442" stroke-width="2">
    <g transform="translate(70 520)"><circle r="90"/><circle r="64"/><circle r="38"/></g>
    <g transform="translate(1540 70)"><circle r="80"/><circle r="56"/><circle r="32"/></g>
  </g>
  <g id="petals1" transform="translate(70 520)" opacity=".18"></g>
  <g id="petals2" transform="translate(1540 70)" opacity=".18"></g>

  <!-- marigold garland (two swags) -->
  <path id="swag" d="M0 18 Q 400 120 800 22 Q 1200 120 1600 18" fill="none" stroke="#3f7d4a" stroke-width="3"/>
  <g id="garland"></g>

  <!-- table -->
  <rect x="0" y="470" width="1600" height="90" fill="#e3c39a"/>
  <rect x="0" y="466" width="1600" height="8" fill="#d2ab7c"/>

  <!-- ===== LEFT: whey tubs ===== -->
  <g transform="translate(40 0)">
    <!-- tub A -->
    <g>
      <rect x="40" y="262" width="168" height="208" rx="18" fill="#2b2b38"/>
      <rect x="32" y="244" width="184" height="34" rx="10" fill="#1d1d27"/>
      <rect x="40" y="318" width="168" height="92" fill="#c96442"/>
      <text x="124" y="358" text-anchor="middle" class="t-label" fill="#fff6ea">WHEY</text>
      <text x="124" y="386" text-anchor="middle" class="t-small" fill="#fff6ea" style="fill:#ffe9d2">1 KG · CHOCO</text>
      <rect x="40" y="262" width="22" height="208" fill="#fff" opacity=".07"/>
    </g>
    <!-- tub B -->
    <g>
      <rect x="236" y="300" width="142" height="170" rx="16" fill="#2f7d74"/>
      <rect x="229" y="285" width="156" height="30" rx="9" fill="#215c55"/>
      <rect x="236" y="345" width="142" height="74" fill="#f6e7cf"/>
      <text x="307" y="378" text-anchor="middle" class="t-label" fill="#215c55">ISOLATE</text>
      <text x="307" y="402" text-anchor="middle" class="t-small">2 LB</text>
      <rect x="236" y="300" width="18" height="170" fill="#fff" opacity=".08"/>
    </g>
    <!-- tub C -->
    <g>
      <rect x="402" y="338" width="112" height="132" rx="14" fill="#e3a23b"/>
      <rect x="396" y="326" width="124" height="26" rx="8" fill="#b97f22"/>
      <rect x="402" y="372" width="112" height="56" fill="#2b2b38"/>
      <text x="458" y="406" text-anchor="middle" class="t-label" fill="#f7d48a" style="font-size:17px">RAW</text>
    </g>

    <!-- price tag on a string from tub A -->
    <path d="M196 270 C 230 230, 250 214, 262 196" stroke="#6b5a4a" stroke-width="2" fill="none"/>
    <g transform="translate(250 92) rotate(-8)">
      <path d="M0 22 L22 0 H220 a12 12 0 0 1 12 12 V150 a12 12 0 0 1 -12 12 H22 L0 140 Z" fill="#fffaf0" stroke="#d9b98f" stroke-width="2"/>
      <circle cx="22" cy="81" r="7" fill="#f0dcbf" stroke="#d9b98f" stroke-width="2"/>
      <text x="48" y="48" class="t-tag">MRP ₹5,299</text>
      <line x1="46" y1="41" x2="196" y2="41" stroke="#b4532f" stroke-width="3"/>
      <text x="48" y="104" class="t-tagbig">−38% OFF</text>
      <text x="48" y="136" class="t-small">DIWALI DEAL*</text>
    </g>

    <!-- magnifying glass revealing the real change -->
    <g transform="translate(470 196) rotate(-8)">
      <line x1="-48" y1="52" x2="-112" y2="118" stroke="#6b3f26" stroke-width="22" stroke-linecap="round"/>
      <circle r="70" fill="#8a5a3a"/>
      <circle r="62" fill="#f2fbf4"/>
      <g clip-path="url(#lensClip)">
        <circle r="62" fill="#e7f5ea"/>
        <text x="0" y="-10" text-anchor="middle" class="t-lenssm">REAL CHANGE</text>
        <text x="0" y="26" text-anchor="middle" class="t-lens">−5%</text>
      </g>
      <circle r="62" fill="none" stroke="#fff" stroke-width="6" opacity=".55" stroke-dasharray="40 400" transform="rotate(200)"/>
    </g>
  </g>

  <!-- ===== CENTRE: title ===== -->
  <g transform="translate(800 0)" text-anchor="middle">
    <text y="140" class="t-eyebrow">NAKED COMPOUND · DEAL CHECK 2026</text>
    <text y="226" class="t-title">Diwali Whey</text>
    <text y="306" class="t-serif">Protein Sale</text>
    <text y="366" class="t-sub">Which discounts are actually real?</text>
    <text y="408" class="t-small">16 TUBS · 12 MONTHS OF PRICE HISTORY</text>
  </g>

  <!-- ===== RIGHT: phone with price history, lantern, diyas ===== -->
  <!-- akash kandil lantern -->
  <g transform="translate(1440 150)">
    <line x1="0" y1="-150" x2="0" y2="-62" stroke="#6b5a4a" stroke-width="2"/>
    <circle r="120" fill="url(#glow)"/>
    <polygon points="0,-62 30,-20 62,0 30,20 0,62 -30,20 -62,0 -30,-20" fill="#e2553a"/>
    <polygon points="0,-40 18,-12 40,0 18,12 0,40 -18,12 -40,0 -18,-12" fill="#f6b03f"/>
    <circle r="11" fill="#fff1c9"/>
    <g stroke="#e2553a" stroke-width="2"><line x1="-14" y1="62" x2="-20" y2="104"/><line x1="0" y1="62" x2="0" y2="112"/><line x1="14" y1="62" x2="20" y2="104"/></g>
  </g>

  <!-- phone -->
  <g transform="translate(1110 150) rotate(6)">
    <rect width="210" height="330" rx="28" fill="#24201c"/>
    <rect x="12" y="14" width="186" height="302" rx="18" fill="#fffaf0"/>
    <rect x="80" y="22" width="50" height="7" rx="3.5" fill="#24201c"/>
    <text x="30" y="62" class="t-phone">PRICE · 12 MONTHS</text>
    <g transform="translate(30 80)">
      <line x1="0" y1="150" x2="150" y2="150" stroke="#e6ddcf" stroke-width="1.5"/>
      <line x1="0" y1="100" x2="150" y2="100" stroke="#efe7da" stroke-width="1"/>
      <line x1="0" y1="50" x2="150" y2="50" stroke="#efe7da" stroke-width="1"/>
      <polyline points="0,140 22,136 40,128 58,120 74,104 92,92 108,70 124,40 138,30 150,38" fill="none" stroke="#3d72b8" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="150" cy="38" r="7" fill="#d0663f" stroke="#fffaf0" stroke-width="3"/>
      <circle cx="0" cy="140" r="6" fill="#2f9a52" stroke="#fffaf0" stroke-width="3"/>
    </g>
    <text x="30" y="262" class="t-phone" style="fill:#2f9a52">● Last Diwali</text>
    <text x="30" y="284" class="t-phone" style="fill:#b4532f">● This Diwali</text>
  </g>

  <!-- diyas -->
  <g id="diyas"></g>

  <!-- sparkles -->
  <g fill="#f6b03f" id="sparkles"></g>
</svg>
<script>
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
// Marigolds along the swag
const swag = document.getElementById('swag'), g = document.getElementById('garland'), L = swag.getTotalLength();
for (let i = 0, n = 64; i <= n; i++) {
  const p = swag.getPointAtLength(L * i / n);
  el('circle', { cx: p.x, cy: p.y + 6, r: i % 2 ? 11 : 13, fill: i % 3 === 0 ? '#f2a13a' : i % 3 === 1 ? '#e8761f' : '#f6c44a' }, g);
  el('circle', { cx: p.x, cy: p.y + 6, r: 4, fill: '#c9581a', opacity: .55 }, g);
}
// Tassels at the swag low points
for (const x of [400]) {
  const p = swag.getPointAtLength(L * (x / 1600));
  for (let k = 0; k < 4; k++) el('circle', { cx: x, cy: p.y + 30 + k * 20, r: 9, fill: k % 2 ? '#f6c44a' : '#e8761f' }, g);
  el('path', { d: `M${x - 10} ${p.y + 108} q10 22 20 0`, fill: '#3f7d4a' }, g);
}
// Rangoli petals
for (const [id, R] of [['petals1', 76], ['petals2', 68]]) {
  const host = document.getElementById(id);
  for (let a = 0; a < 360; a += 30) el('ellipse', { cx: 0, cy: -R, rx: 9, ry: 20, fill: '#c96442', transform: `rotate(${a})` }, host);
}
// Diyas on the table, right side
const diyas = document.getElementById('diyas');
for (const [x, s] of [[1370, 1], [1480, .85], [1560, .7]]) {
  const d = el('g', { transform: `translate(${x} 470) scale(${s})` }, diyas);
  el('circle', { cx: 0, cy: -58, r: 46, fill: 'url(#glow)' }, d);
  el('path', { d: 'M-46 -26 Q0 34 46 -26 Z', fill: 'url(#clay)' }, d);
  el('path', { d: 'M-46 -26 Q0 -12 46 -26', fill: 'none', stroke: '#e9b38c', 'stroke-width': 3 }, d);
  el('path', { d: 'M0 -82 C 14 -64 12 -46 0 -38 C -12 -46 -14 -64 0 -82 Z', fill: 'url(#flame)' }, d);
  el('circle', { cx: 0, cy: -46, r: 4, fill: '#fff4cf' }, d);
}
// Sparkles
const sp = document.getElementById('sparkles');
for (const [x, y, s] of [[640, 70, 1], [960, 96, .8], [560, 430, .7], [1050, 120, .6], [700, 470, .5], [1330, 330, .7], [380, 60, .6]]) {
  el('path', { d: 'M0 -14 L3 -3 L14 0 L3 3 L0 14 L-3 3 L-14 0 L-3 -3 Z', transform: `translate(${x} ${y}) scale(${s})` }, sp);
}
</script>
</body>
</html>
