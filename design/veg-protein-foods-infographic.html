<script>
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
const txt = (x, y, cls, s, p) => { const t = el('text', { x, y, 'text-anchor': 'middle', class: cls }, p); t.textContent = s; return t; };

// Bowl with a heap of small items: draws the heap inside the rim, then the bowl body in front.
function bowl(g, color, rimColor, item) {
  el('ellipse', { cx: 0, cy: 8, rx: 96, ry: 26, fill: rimColor }, g);
  const id = 'clip' + Math.round(rnd() * 1e9);

    const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd());
    const x = Math.cos(a) * r * 84, y = 6 + Math.sin(a) * r * 20 - (1 - r) * 26;
    item(heap, x, y, i);

  el('path', { d: 'M-100 10 Q-96 92 0 98 Q96 92 100 10 Q0 44 -100 10 Z', fill: color }, g);

  rajma(g) {

    for (let i = 0; i < 16; i++) { const x = -78 + (i % 6) * 31 + rnd() * 8, y = 10 + Math.floor(i / 6) * 20 + rnd() * 6;
      el('path', { d: `M${x - 16} ${y} c0 -12 14 -12 16 -4 c2 -8 16 -8 16 4 c0 12 -32 12 -32 0 z`, fill: '#8e1f2b', transform: `rotate(${rnd() * 60 - 30} ${x} ${y})` }, g);

      const s = el('g', { transform: `translate(${x} ${y}) rotate(${r})` }, g);
      el('path', { d: 'M0 -34 c22 10 26 50 0 58 c-26 -8 -22 -48 0 -58 z', fill: '#b8733e', stroke: '#93582b', 'stroke-width': 2 }, s);
      for (const dy of [-16, -4, 8]) el('path', { d: `M-8 ${dy} q8 3 16 0`, fill: 'none', stroke: '#9b5e2f', 'stroke-width': 1.5 }, s);

};

const LEFT = [

  ['rajma', 'RAJMA', '10 g · 50 g dry'], ['moong', 'MOONG DAL', '12 g · 50 g dry'], ['peanuts', 'PEANUTS', '7 g · 30 g'],

  ['soybean', 'SOYABEAN', '18 g · 50 g dry'], ['masoor', 'MASOOR DAL', '12 g · 50 g dry'], ['almonds', 'ALMONDS', '6 g · 30 g'],
];
function panel(list, x0, cls) {
  list.forEach(([icon, name, val], i) => {
    const col = i % 3, row = Math.floor(i / 3);
    const cx = x0 + 133 + col * 266, cy = 340 + row * 450;
    const g = el('g', { transform: `translate(${cx} ${cy})` }, cells);
    ICONS[icon](g);
    txt(cx, cy + 200, 'name', name, cells);
    txt(cx, cy + 236, cls, val, cells);
  });
}
